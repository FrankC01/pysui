# pyproject.toml
[tool.pytest.ini_options]
testpaths = ["tests/unit_tests", "tests/integration_tests"]
pythonpath = ["pysui", "abstracts", "sui", "sui/sui_types", "tests/unit_tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: marks tests as integration tests (require live devnet/testnet node)",
]

[build-system]
requires = ["setuptools>=61.0", "wheel","setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pysui"

description = "SUI client Python SDK"
requires-python = ">=3.10"
keywords = ["software development kit", "sui", "blockchain"]
license = "Apache-2.0"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
    "betterproto2[grpclib] < 1.0.0, >= 0.10.0",
    "dataclasses_json < 0.7.0, >= 0.6.6",
    "PyYAML < 6.2, >= 6.0.1",
    "httpx < 0.29, >=0.28.1",
    "httpx-sse >= 0.4.0",
    "h2 < 5.0, >= 4.2.0",
    "jsonschema < 4.30, >= 4.23.0",
    "gql[httpx] >= 4.0.0",
    "typing_utils < 0.2.0, >=0.1.0",
    "canoser==0.8.2",
    "base58 < 2.2.0, >=2.1.1",
    "Deprecated < 1.4.0, >=1.3.1",
    "pysui-fastcrypto >= 0.7.7",
    ]

dynamic = ["version", "readme"]


[project.scripts]
wallet = "samples.walletg:main"
async-gas = "samples.async_gasg:main"
sgqls = "samples.sgqls:main"
smash= "samples.smash:main"
splay= "samples.splay:main"
mtobcs="samples.mtobcs:main"

[project.optional-dependencies]
zklogin-seal = ["pysui-crypto==0.1.0"]

[tool.setuptools.packages.find]
include = ["pysui*","samples*"]
exclude = [
    "env*",
    "out*",
    "temp*",
    "test*",
    "tools*",
    "build*",
    "doc*",
    "pysuienv*",
    "images*",
]


[tool.setuptools.dynamic]
version = { attr = "pysui.version.__version__" }
readme = { file = ["README.md"], content-type = "text/markdown" }

[tool.setuptools.package-data]
pysui = ["**/*.json", "py.typed"]
samples = ["*.json"]

[project.urls]
changelog = "https://github.com/FrankC01/pysui/blob/main/CHANGELOG.md"
repository = "https://github.com/FrankC01/pysui"
issues = "https://github.com/FrankC01/pysui/issues"
documentation = "https://pysui.readthedocs.io"

[tool.pylint.main]
extension-pkg-allow-list = ["pysui_fastcrypto"]
ignore-paths = [
    '^pysui/sui/sui_grpc/suimsgs/.*$',
]
ignore-patterns = ['^sui_system_bcs\.py$']

[tool.pylint."messages control"]
disable = [
    "line-too-long",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-locals",
    "too-many-positional-arguments",
    "too-many-instance-attributes",
    "too-many-branches",
    "too-many-return-statements",
    "too-many-statements",
    "too-many-public-methods",
    "too-many-lines",
    "fixme",
    "wrong-import-position",
    "import-outside-toplevel",
    "duplicate-code",
    "protected-access",
    "unused-argument",
    "broad-exception-caught",
    "redefined-builtin",
]

[tool.pylint.basic]
# Class names: allow protocol-prefixed classes (PGQL_, PGRPC_, BCS_) alongside
# ordinary PascalCase.
class-rgx = "^_?(PGQL_|PGRPC_|BCS_)?[A-Z][a-zA-Z0-9]*$"
# Class-level "constant" attributes: allow UPPER_CASE (true constants) alongside
# PascalCase names that mirror Sui/BCS protocol type or enum-variant names
# (e.g. TransactionData, AesGcm256).
class-const-rgx = "^([A-Z_][A-Z0-9_]*|[A-Z][a-zA-Z0-9]*)$"
# Instance/dataclass attributes: allow snake_case, camelCase (GraphQL wire-field
# mirroring via dataclasses_json), and PascalCase (category-label fields).
attr-rgx = "^[a-z_][a-zA-Z0-9_]*$|^[A-Z][a-zA-Z0-9]*$"
# Local variables: allow snake_case alongside UPPER_CASE "local constants"
# (module-scoped query strings/lookup tables defined inside a class/function body).
variable-rgx = "^[a-z_][a-z0-9_]*$|^_?[A-Z][A-Z0-9_]*$"
# Method names: allow snake_case alongside visit_ClassName visitor-pattern methods.
method-rgx = "^[a-z_][a-z0-9_]*$|^visit_[A-Z][a-zA-Z0-9]*$"

[tool.pylint.typecheck]
# Attributes set dynamically at runtime that pylint's static analysis cannot see.
generated-members = [
    # canoser _fields-based BCS structs (pysui.sui.sui_bcs) — attributes set via
    # canoser.Struct.initailize_fields_type() looping over the class's _fields list
    'Digest\..*',
    'ObjectReference\..*',
    'SharedObjectReference\..*',
    'FundsWithdrawal\..*',
    'ProgrammableMoveCall\..*',
    'TransferObjects\..*',
    'SplitCoin\..*',
    'MergeCoins\..*',
    'Publish\..*',
    'MakeMoveVec\..*',
    'Upgrade\..*',
    'CheckpointSummaryBCS\..*',
    # dataclasses_json-decorated classes — @dataclass_json injects from_dict/to_dict/
    # from_json/to_json; @dataclasses.dataclass injects __dataclass_fields__; pylint
    # loses track when the two decorators are stacked
    'TransactionConstraints\..*',
    'ProtocolConfigGQL\..*',
    'SuiConfigGQL\..*',
    'Structure\..*',
    'GenericStructure\..*',
    '_ZkSealConfigModel\..*',
    # abstract base referencing a subclass-contract attribute every concrete
    # subclass is required to set (~20 subclasses in pgrpc_requests.py)
    'PGRPC_Request\.RESULT_TYPE',
]

[tool.mypy]

[[tool.mypy.overrides]]
module = "canoser.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "dateutil.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pysui.sui.sui_grpc.suimsgs.*"
ignore_errors = true
